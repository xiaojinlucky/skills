<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="title desc">
  <title id="title">Meta Research Hub，把卡住的课题收成下一步</title>
  <desc id="desc">面向研究生的中文科研判断系统。1 个总入口，13 个专业 Skills。路径为卡点到证据到判断到下一步。</desc>

  <defs>
    <clipPath id="subject-area">
      <rect x="720" y="0" width="480" height="520"/>
    </clipPath>
    <clipPath id="board">
      <rect width="1200" height="520" rx="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#board)">
    <rect width="1200" height="520" rx="34" fill="#F0EFEB"/>
    <path d="M760 0H1200V520H752C779 493 793 461 793 420C793 373 765 349 744 315C724 283 718 241 736 201C754 160 780 127 780 88C780 53 773 26 760 0Z"
          fill="#43593B"/>
    <circle cx="1036" cy="102" r="82" fill="#D4A017"/>
    <circle cx="822" cy="433" r="132" fill="#ACAD79" opacity="0.42"/>
    <path d="M784 62C850 26 908 23 968 42" fill="none" stroke="#F2D17E" stroke-width="3" opacity="0.82"/>
    <path d="M781 78C846 47 901 45 955 58" fill="none" stroke="#F2D17E" stroke-width="2" opacity="0.56"/>
    <path d="M1088 394C1122 363 1145 326 1156 282" fill="none" stroke="#77835A" stroke-width="3" opacity="0.8"/>
    <path d="M1110 402C1142 382 1166 354 1182 320" fill="none" stroke="#77835A" stroke-width="2" opacity="0.55"/>
  </g>

  <g id="identity" transform="translate(64 0)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="0" y="68" fill="#77835A"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Microsoft YaHei', monospace"
          font-size="18" font-weight="700" letter-spacing="2.6">META RESEARCH HUB</text>
    <rect x="0" y="90" width="58" height="6" rx="3" fill="#D4A017"/>

    <text x="0" y="176" fill="#58402E" font-size="68" font-weight="700">把卡住的课题</text>
    <text x="0" y="258" fill="#58402E" font-size="68" font-weight="700">收成下一步</text>
    <text x="2" y="322" fill="#43593B" font-size="26" font-weight="650">面向研究生的中文科研判断系统</text>

    <path d="M0 378H620" stroke="#ACAD79" stroke-width="2"/>
    <circle cx="0" cy="378" r="6" fill="#D4A017"/>
    <text x="0" y="422" fill="#58402E" font-size="22" font-weight="700">卡点 → 证据 → 判断 → 下一步</text>
    <text x="0" y="474" fill="#77835A"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Microsoft YaHei', monospace"
          font-size="18" letter-spacing="0.8">1 个总入口 · 13 个专业 Skills</text>
  </g>

  <g id="avatar-stage">
    <image href="hero-subject.png" x="704" y="-8" width="540" height="560"
           preserveAspectRatio="xMidYMax meet" clip-path="url(#subject-area)"/>
  </g>
</svg>
