<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Meta Research Hub，把科研问题说清楚，再决定下一步</title>
  <desc id="desc">面向研究生的中文科研方法 Skills，帮助用户从问题出发，找到证据和下一步。</desc>

  <rect width="1200" height="400" rx="30" fill="#F0EFEB"/>
  <path d="M0 316 C210 276 334 352 548 322 C780 289 942 320 1200 247 V400 H0 Z" fill="#E3E3D8"/>

