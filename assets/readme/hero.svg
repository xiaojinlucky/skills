<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="title desc">
  <title id="title">做科研的大师兄</title>
  <desc id="desc">面向研究生的中文科研思路 Skills，帮助课题从发现问题走向可判断、可验证、可写成论文主线的下一步。</desc>

  <rect width="1200" height="340" rx="28" fill="#F0EFEB"/>

  <g id="title-block"
     font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="138" font-size="72" font-weight="750" fill="#43593B">
      做科研的大师兄
    </text>
    <text x="72" y="208" font-size="40" font-weight="650" fill="#58402E">
      把课题从「有想法」推进到「有下一步」
    </text>
  </g>

  <g id="research-path" aria-hidden="true">
    <path d="M790 272 C848 272 846 214 902 214 S958 154 1014 154 S1068 84 1122 84"
          fill="none" stroke="#ACAD79" stroke-width="12" stroke-linecap="round"/>

    <circle cx="790" cy="272" r="35" fill="#F2D17E" stroke="#58402E" stroke-width="4"/>
    <text x="790" y="284" text-anchor="middle"
          font-family="Georgia,'Songti SC',serif" font-size="42" font-weight="700" fill="#58402E">?</text>

    <g transform="translate(864 172)">
      <rect width="76" height="84" rx="16" fill="#F0EFEB" stroke="#77835A" stroke-width="4"/>
      <path d="M18 24H58 M18 42H52 M18 60H44" stroke="#77835A" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g transform="translate(977 117)">
      <rect width="74" height="74" rx="20" fill="#43593B"/>
      <path d="M19 39l12 12 25-29" fill="none" stroke="#F0EFEB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <circle cx="1122" cy="84" r="38" fill="#D4A017"/>
    <path d="M1106 84h29m-11-12 12 12-12 12" fill="none" stroke="#58402E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M806 42h316" stroke="#58402E" stroke-width="2" opacity=".16"/>
    <path d="M742 310h380" stroke="#58402E" stroke-width="2" opacity=".14"/>
  </g>
