    <text x="64" y="52" text-anchor="start"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Microsoft YaHei', monospace"
          font-size="22" font-weight="700" letter-spacing="2.4" fill="#F2D17E">META RESEARCH HUB</text>
    <text x="180" y="252" font-size="42" font-weight="750">卡点</text>
    <text x="470" y="252" font-size="42" font-weight="750">证据</text>
    <text x="740" y="252" font-size="42" font-weight="750">判断</text>
    <text x="1020" y="252" font-size="42" font-weight="750">下一步</text>
