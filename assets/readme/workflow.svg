  <rect width="1200" height="320" rx="34" fill="#43593B"/>
  <circle cx="1088" cy="54" r="70" fill="#D4A017" opacity="0.22"/>
  <circle cx="96" cy="276" r="90" fill="#ACAD79" opacity="0.18"/>

  <path d="M180 128 C270 128 380 176 470 176 C560 176 650 128 740 128 C830 128 930 176 1020 176"
        fill="none" stroke="#ACAD79" stroke-width="8" stroke-linecap="round"/>

  <g fill="#F2D17E" stroke="#28311F" stroke-width="3">
    <circle cx="180" cy="128" r="16"/>
    <circle cx="255" cy="130" r="8"/>
    <circle cx="330" cy="148" r="8"/>
    <circle cx="400" cy="168" r="8"/>
    <circle cx="470" cy="176" r="16"/>
    <circle cx="540" cy="174" r="8"/>
    <circle cx="610" cy="152" r="8"/>
    <circle cx="675" cy="132" r="8"/>
    <circle cx="740" cy="128" r="16"/>
    <circle cx="815" cy="130" r="8"/>
    <circle cx="885" cy="148" r="8"/>
    <circle cx="950" cy="166" r="8"/>
    <circle cx="1020" cy="176" r="16" fill="#D4A017"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
